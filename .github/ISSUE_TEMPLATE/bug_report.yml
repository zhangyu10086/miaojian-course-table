name: Bug 反馈
description: 报告崩溃、布局错乱、导入失败等问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请先确认已升级到最新版本，并在 Issues 里搜索过同类问题。
        **不要贴学号、密码、教务账号截图。**
  - type: input
    id: version
    attributes:
      label: 小程序版本
      description: 在「我的」页面或小程序右上角「··· → 关于」里可以看到
      placeholder: 例如 1.3.0
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 手机型号与系统
      placeholder: 例如 iPhone 15 / iOS 18.2，或 小米 14 / Android 15
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 问题出现在哪里
      options:
        - 课表页
        - 今日页
        - 我的页
        - 添加/编辑课程
        - 教务导入
        - 导入导出文件
        - 公告
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开...
        2. 点击...
        3. 出现...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 有截图更好；报错信息请直接粘贴文字
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 例如是否设置了学期开始日期、是否导入过教务课表
    validations:
      required: false
